name: Weather Sync

# Pull Helixo daily_weather → write weather.daily into each
# data/<outlet>.json. Powers the Forward Window forecast table's
# Weather + Temp columns. Same Supabase project as Tripleseat,
# Forecast, and Budget syncs.
#
# Slotted at 13:30 UTC = 08:30 ET, after the forecast/budget syncs:
#   12:00 UTC  Toast Sync
#   12:15 UTC  Guest Sync
#   12:30 UTC  MarginEdge Sync
#   12:45 UTC  Tripleseat Sync
#   13:00 UTC  Forecast Sync
#   13:15 UTC  Budget Sync
#   13:30 UTC  Weather Sync          (this)

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      outlet:
        description: 'Optional single outlet id (leave blank = all)'
        required: false
        default: ''
      probe:
        description: 'Run --probe (auth-only health check)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: weather-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: toast-etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r toast-etl/requirements.txt

      - name: Run weather probe (manual only)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          python3 weather_sync.py --probe --data-dir ../data

      - name: Run weather sync
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase service role key not set — skipping weather sync"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 weather_sync.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 weather_sync.py --data-dir ../data
          fi

      - name: Commit refreshed weather
        if: ${{ github.event.inputs.probe != 'true' }}
        run: |
          git config user.name  "method-weather-sync[bot]"
          git config user.email "method-weather-sync@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no weather changes"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): nightly weather sync ${STAMP}"
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying"
            git pull --rebase origin main || {
              echo "rebase failed; aborting"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
