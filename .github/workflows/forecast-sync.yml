name: Forecast Sync

# Pull helixo-2's proprietary AI forecast (daily_forecasts table) →
# write forecast.daily into each data/<outlet>.json. The dashboard's
# tri-comparison KPI cards (vs Forecast / vs STLY / vs Budget) read
# this block.
#
# Per Ross: source is helixo-2's PROPRIETARY AI engine output —
# specifically `ai_suggested_revenue` from daily_forecasts. NOT the
# manager_revenue override field (that's human-edited and not what
# we want for "vs Forecast"). NOT a local Python recomputation.
#
# Slotted at 13:00 UTC = 08:00 ET, after the Toast/Guest/MarginEdge/
# Tripleseat actuals land:
#   12:00 UTC  Toast Sync
#   12:15 UTC  Guest Sync
#   12:30 UTC  MarginEdge Sync
#   12:45 UTC  Tripleseat Sync
#   13:00 UTC  Forecast Sync         (this — pulls helixo-2 AI)
#   13:15 UTC  Budget Sync           (helixo-2 daily_budget)

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      outlet:
        description: 'Optional single outlet id (leave blank = all)'
        required: false
        default: ''
      probe:
        description: 'Run --probe (auth-only health check)'
        type: boolean
        required: false
        default: false
      print_config:
        description: 'Run --print-config (location → outlet routing, no writes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # Decoupled from the shared `data-sync` queue (PR #64) because the
  # GitHub Actions queue keeps only ONE run waiting at a time —
  # late-entrant workflows like forecast get cancelled when a third
  # sync joins the queue. Result: 3+ days of stale helixo-2 forecast
  # data on 2026-05-01..03 even though the schedule fired correctly.
  #
  # Trade-off: re-introduces a small push-race window if forecast
  # commits at the same instant as another writer. Mitigations:
  # (1) forecast writes only `forecast.daily` per outlet and rebase
  # auto-merger handles distinct-key conflicts cleanly, and
  # (2) forecast sync is fast (<5 min) so the overlap window is small.
  group: forecast-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: toast-etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r toast-etl/requirements.txt

      - name: Run forecast probe (manual only)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          python3 forecast_engine.py --probe --data-dir ../data

      - name: Print routing (manual only)
        if: ${{ github.event.inputs.print_config == 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          python3 forecast_engine.py --print-config --data-dir ../data

      - name: Run forecast sync
        if: ${{ github.event.inputs.probe != 'true' && github.event.inputs.print_config != 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase service role key not set — skipping forecast sync"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 forecast_engine.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 forecast_engine.py --data-dir ../data
          fi

      - name: Commit refreshed forecasts
        if: ${{ github.event.inputs.probe != 'true' && github.event.inputs.print_config != 'true' }}
        run: |
          git config user.name  "method-forecast-sync[bot]"
          git config user.email "method-forecast-sync@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no forecast changes"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): nightly forecast sync ${STAMP} (helixo-2 AI)"
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying"
            git pull --rebase origin main || {
              echo "rebase failed; aborting"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
