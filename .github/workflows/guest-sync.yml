name: Guest Sync

# Nightly pull of Resy guest-experience data + Google Reviews for each
# configured outlet. Commits refreshed data/<outlet>.json back to the repo
# so the dashboard on GitHub Pages picks them up on next page load.
#
# Mirrors toast-sync.yml. Both jobs commit to the same files but to
# different keys (toast → order_details, guest → guest), so concurrent
# nightly runs are safe; the `concurrency` group below serializes
# guest-sync against itself.

on:
  schedule:
    # 12:15 UTC = 07:15 ET (EST). 15 min after toast-sync to avoid race
    # over data/*.json. Order: Toast → Guest → MarginEdge → Tripleseat.
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      outlet:
        description: 'Optional single outlet id to sync (leave blank = all).'
        required: false
        default: ''
      probe:
        description: 'Run resy_sync.py --probe (auth + endpoint discovery, no writes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write  # needed to commit regenerated JSON

concurrency:
  # Shared with the other data/<outlet>.json writers (toast-sync,
  # budget-sync, forecast-sync, marginedge-sync, tripleseat-sync) so
  # cross-workflow runs serialize on git push instead of racing into
  # rebase conflicts. See toast-sync.yml for the full rationale.
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: toast-etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r toast-etl/requirements.txt

      # ---- Resy OS scraper (Playwright-based) ----
      # Replaces resy_sync.py (consumer API path) which 419s against
      # operator credentials. Activates only when RESY_OS_STORAGE_STATE_JSON
      # is set — see docs/RESY_OS_SCRAPER.md for bootstrap.
      #
      # Install Playwright unconditionally — the install is ~30s and the
      # downstream Resy OS steps no-op cleanly when the secret is empty.
      # GitHub Actions doesn't allow `secrets.*` in step `if:` conditions
      # (rejected at YAML parse time), so a secret-presence gate isn't
      # available here. Past variants:
      #   PR #10 — gated on `inputs.probe != 'true'`; broke discovery mode.
      #   PR #11 — gated on `secrets.RESY_OS_STORAGE_STATE_JSON != ''`;
      #            failed YAML validation.
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run Resy OS scraper
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          RESY_OS_STORAGE_STATE_JSON: ${{ secrets.RESY_OS_STORAGE_STATE_JSON }}
          RESY_OS_VENUES:             ${{ secrets.RESY_OS_VENUES }}
        run: |
          cd toast-etl
          if [ -z "$RESY_OS_STORAGE_STATE_JSON" ]; then
            echo "RESY_OS_STORAGE_STATE_JSON not set — skipping Resy OS scrape"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 resy_os_scraper.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 resy_os_scraper.py --data-dir ../data
          fi

      - name: Run Resy OS discovery (manual only)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          RESY_OS_STORAGE_STATE_JSON: ${{ secrets.RESY_OS_STORAGE_STATE_JSON }}
          RESY_OS_VENUES:             ${{ secrets.RESY_OS_VENUES }}
        run: |
          cd toast-etl
          python3 resy_os_scraper.py --discover --data-dir ../data

      # ---- Google Reviews ----
      - name: Run Google Reviews sync
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES:         ${{ secrets.GOOGLE_PLACES }}
        run: |
          cd toast-etl
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 google_reviews_sync.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 google_reviews_sync.py --data-dir ../data
          fi

      # ---- Commit ----
      - name: Commit refreshed data
        if: ${{ github.event.inputs.probe != 'true' }}
        run: |
          git config user.name  "method-guest-sync[bot]"
          git config user.email "method-guest-sync@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no guest data changes"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): nightly guest sync ${STAMP}"
          # Rebase-and-retry guard against race with toast-sync /
          # marginedge-sync / tripleseat-sync / budget-sync. They all
          # push to data/*.json on overlapping schedules; a naked push
          # gets rejected when another job lands first and the commit is
          # silently dropped. Mirrors toast-sync.yml's pattern (PR #58
          # 2026-04-30 incident: guest-sync committed +12 surveys then
          # lost the push to a concurrent toast-sync). Three attempts
          # with linear backoff.
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying"
            git pull --rebase origin main || {
              echo "rebase failed; aborting to avoid clobbering remote"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
