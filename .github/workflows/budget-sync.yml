name: Budget Sync

# Pull helixo-2 daily_budget table → write budget.daily into each
# data/<outlet>.json. Sourced from the same Supabase project as the
# Tripleseat config (mmwislzsgnjxjxssynwm). Powers the "vs Budget"
# line on every KPI card across Revenue / Performance Summary / Snapshot.
#
# Slotted at 13:15 UTC = 08:15 ET, 15min after Forecast Sync, last in
# the daily ETL cadence:
#   12:00 UTC  Toast Sync
#   12:15 UTC  Guest Sync
#   12:30 UTC  MarginEdge Sync
#   12:45 UTC  Tripleseat Sync
#   13:00 UTC  Forecast Sync
#   13:15 UTC  Budget Sync          (this)

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      outlet:
        description: 'Optional single outlet id (leave blank = all)'
        required: false
        default: ''
      probe:
        description: 'Run --probe (auth-only health check)'
        type: boolean
        required: false
        default: false
      print_config:
        description: 'Run --print-config (location → outlet routing, no writes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # Shared with the other data/<outlet>.json writers (toast-sync,
  # forecast-sync, guest-sync, marginedge-sync, tripleseat-sync) so
  # cross-workflow runs serialize on git push instead of racing into
  # rebase conflicts. See toast-sync.yml for the full rationale.
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: toast-etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r toast-etl/requirements.txt

      - name: Run budget probe (manual only)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          python3 budget_sync.py --probe --data-dir ../data

      - name: Print routing (manual only)
        if: ${{ github.event.inputs.print_config == 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          python3 budget_sync.py --print-config --data-dir ../data

      - name: Run budget sync
        if: ${{ github.event.inputs.probe != 'true' && github.event.inputs.print_config != 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd toast-etl
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase service role key not set — skipping budget sync"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 budget_sync.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 budget_sync.py --data-dir ../data
          fi

      - name: Commit refreshed budgets
        if: ${{ github.event.inputs.probe != 'true' && github.event.inputs.print_config != 'true' }}
        run: |
          git config user.name  "method-budget-sync[bot]"
          git config user.email "method-budget-sync@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no budget changes"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): nightly budget sync ${STAMP}"
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying"
            git pull --rebase origin main || {
              echo "rebase failed; aborting"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1

      - name: Upload validation files to Supabase
        if: success()
        uses: ./.github/actions/upload-validation
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
