name: MarginEdge Sync

# Nightly pull of MarginEdge invoices + vendors + products + categories for
# each configured outlet. Writes a `cogs` block into data/<outlet>.json that
# the dashboard's Cost of Goods section consumes.
#
# Activates only when MARGINEDGE_KEYS secret is set — see
# `toast-etl/marginedge_sync.py` for setup procedure.

on:
  schedule:
    # 12:30 UTC = 07:30 ET (EST). Third in the daily cadence — after
    # Toast (12:00) and Guest (12:15), before Tripleseat (12:45).
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      outlet:
        description: 'Optional single outlet id to sync (leave blank = all).'
        required: false
        default: ''
      probe:
        description: 'Run --probe (auth-only health check, no writes)'
        type: boolean
        required: false
        default: false
      lookback:
        description: 'Days back to pull invoices (default 90)'
        required: false
        default: '90'

permissions:
  contents: write

concurrency:
  # Shared with the other data/<outlet>.json writers (toast-sync,
  # budget-sync, forecast-sync, guest-sync, tripleseat-sync) so
  # cross-workflow runs serialize on git push instead of racing into
  # rebase conflicts. See toast-sync.yml for the full rationale.
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 5-hour ceiling: line-item fetch is ~1 API call per order at 1.0s
    # rate limit. With ~6k orders across 11 outlets a full backfill runs
    # ~2 hours; nightly incrementals are <10 min. Was 30 — caused
    # scheduled run 25171463855 to cancel mid-fetch with no commit
    # produced. Bumped briefly to 90, still insufficient under sustained
    # 429-storm (run 25186157102, 2026-04-30). 300 gives plenty of
    # headroom for the slower 1.0s-sleep cadence + 429 backoff.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: toast-etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r toast-etl/requirements.txt

      - name: Run MarginEdge sync
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          MARGINEDGE_API_KEY:       ${{ secrets.MARGINEDGE_API_KEY }}
          MARGINEDGE_BASE_URL:      ${{ secrets.MARGINEDGE_BASE_URL }}
          MARGINEDGE_LOOKBACK_DAYS: ${{ github.event.inputs.lookback || '90' }}
        run: |
          cd toast-etl
          if [ -z "$MARGINEDGE_API_KEY" ]; then
            echo "MARGINEDGE_API_KEY not set — skipping MarginEdge sync"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 marginedge_sync.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 marginedge_sync.py --data-dir ../data
          fi

      - name: Run MarginEdge probe (manual only)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          MARGINEDGE_API_KEY:  ${{ secrets.MARGINEDGE_API_KEY }}
          MARGINEDGE_BASE_URL: ${{ secrets.MARGINEDGE_BASE_URL }}
        run: |
          cd toast-etl
          python3 marginedge_sync.py --probe --data-dir ../data

      - name: Commit refreshed cogs data
        if: ${{ github.event.inputs.probe != 'true' }}
        run: |
          git config user.name  "method-marginedge-sync[bot]"
          git config user.email "method-marginedge-sync@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no cogs changes"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): nightly MarginEdge sync ${STAMP}"
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying"
            git pull --rebase origin main || {
              echo "rebase failed; aborting"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
