name: MarginEdge Sync

# Nightly pull of MarginEdge invoices + vendors + products + categories for
# each configured outlet. Writes a `cogs` block into data/<outlet>.json that
# the dashboard's Cost of Goods section consumes.
#
# Activates only when MARGINEDGE_KEYS secret is set — see
# `toast-etl/marginedge_sync.py` for setup procedure.

on:
  schedule:
    # 08:15 UTC = 04:15 ET. After Toast (03:15) and guest-sync (03:45) so
    # Method's nightly pulls land in this order: orders+labor → guest →
    # COGS. Each subsequent commit rebases over the prior cleanly.
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      outlet:
        description: 'Optional single outlet id to sync (leave blank = all).'
        required: false
        default: ''
      probe:
        description: 'Run --probe (auth-only health check, no writes)'
        type: boolean
        required: false
        default: false
      lookback:
        description: 'Days back to pull invoices (default 90)'
        required: false
        default: '90'

permissions:
  contents: write

concurrency:
  group: marginedge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: toast-etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r toast-etl/requirements.txt

      - name: Run MarginEdge sync
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          MARGINEDGE_KEYS:           ${{ secrets.MARGINEDGE_KEYS }}
          MARGINEDGE_BASE_URL:       ${{ secrets.MARGINEDGE_BASE_URL }}
          MARGINEDGE_AUTH_HEADER:    ${{ secrets.MARGINEDGE_AUTH_HEADER }}
          MARGINEDGE_AUTH_PREFIX:    ${{ secrets.MARGINEDGE_AUTH_PREFIX }}
          MARGINEDGE_INVOICES_PATH:  ${{ secrets.MARGINEDGE_INVOICES_PATH }}
          MARGINEDGE_VENDORS_PATH:   ${{ secrets.MARGINEDGE_VENDORS_PATH }}
          MARGINEDGE_PRODUCTS_PATH:  ${{ secrets.MARGINEDGE_PRODUCTS_PATH }}
          MARGINEDGE_CATEGORIES_PATH: ${{ secrets.MARGINEDGE_CATEGORIES_PATH }}
          MARGINEDGE_LOOKBACK_DAYS:  ${{ github.event.inputs.lookback || '90' }}
        run: |
          cd toast-etl
          if [ -z "$MARGINEDGE_KEYS" ]; then
            echo "MARGINEDGE_KEYS not set — skipping MarginEdge sync"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outlet }}" ]; then
            python3 marginedge_sync.py --outlet "${{ github.event.inputs.outlet }}" --data-dir ../data
          else
            python3 marginedge_sync.py --data-dir ../data
          fi

      - name: Run MarginEdge probe (manual only)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          MARGINEDGE_KEYS:           ${{ secrets.MARGINEDGE_KEYS }}
          MARGINEDGE_BASE_URL:       ${{ secrets.MARGINEDGE_BASE_URL }}
          MARGINEDGE_AUTH_HEADER:    ${{ secrets.MARGINEDGE_AUTH_HEADER }}
          MARGINEDGE_AUTH_PREFIX:    ${{ secrets.MARGINEDGE_AUTH_PREFIX }}
          MARGINEDGE_VENDORS_PATH:   ${{ secrets.MARGINEDGE_VENDORS_PATH }}
        run: |
          cd toast-etl
          python3 marginedge_sync.py --probe --data-dir ../data

      - name: Commit refreshed cogs data
        if: ${{ github.event.inputs.probe != 'true' }}
        run: |
          git config user.name  "method-marginedge-sync[bot]"
          git config user.email "method-marginedge-sync@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no cogs changes"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): nightly MarginEdge sync ${STAMP}"
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying"
            git pull --rebase origin main || {
              echo "rebase failed; aborting"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
