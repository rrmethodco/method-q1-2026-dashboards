# Method Co — Trustworthy Reporting Engine (Phase A.1)
# Linked to project method-kpi (ref: mmwislzsgnjxjxssynwm)
project_id = "mmwislzsgnjxjxssynwm"

[functions.agent-worker]
# verify_jwt = false because Supabase's late-2024 API key migration
# replaced legacy JWT keys (eyJ...) with opaque sb_secret_<...> tokens
# that are NOT JWTs. With verify_jwt = true, those rejected with
# UNAUTHORIZED_INVALID_JWT_FORMAT. Legacy JWT keys are no longer
# exposed in the dashboard for newer projects.
#
# In place of Supabase's JWT check, the function (index.ts) has a
# custom Bearer shared-secret check against AGENT_WORKER_AUTH_SECRET.
# pg_cron stores the same value in Vault and sends it each tick.
# This addresses the BLOCK DEPLOY security finding (2026-05-04) without
# coupling our auth model to Supabase's evolving key formats.
verify_jwt = false
